<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ACE Global Group Africa</title>
  <desc id="d">Globe emblem with a gold-barred letter A, beside the ACE Global Group wordmark.</desc>

  <!-- Emblem -->
  <g transform="translate(10 10)">
    <rect width="120" height="120" rx="30" fill="#0f172a"/>
    <rect x="1.5" y="1.5" width="117" height="117" rx="28.5" fill="none" stroke="#34d399" stroke-opacity=".25" stroke-width="1.5"/>

    <!-- Globe -->
    <g fill="none" stroke="#34d399" stroke-opacity=".45" stroke-width="1.4">
      <circle cx="60" cy="60" r="40"/>
      <ellipse cx="60" cy="60" rx="16" ry="40"/>
      <ellipse cx="60" cy="60" rx="40" ry="14"/>
      <line x1="60" y1="20" x2="60" y2="100"/>
    </g>

    <!-- Letter A -->
    <path d="M38 92 L60 28 L82 92" fill="none" stroke="#ffffff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 74 H73" fill="none" stroke="#d4a63a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="60" cy="19" r="3.2" fill="#d4a63a"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Montserrat','Poppins','Segoe UI',Arial,sans-serif">
    <text x="156" y="76" font-size="50" font-weight="800" letter-spacing="3" fill="#0f172a">ACE</text>
    <text x="156" y="102" font-size="17" font-weight="700" letter-spacing="7.5" fill="#047857">GLOBAL GROUP</text>
    <line x1="156" y1="114" x2="188" y2="114" stroke="#d4a63a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="198" y="118" font-size="10.5" font-weight="600" letter-spacing="5" fill="#64748b">AFRICA</text>
  </g>
</svg>
